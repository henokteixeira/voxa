server {
  listen 80;
  root /usr/share/nginx/html;

  # Single-page app: unknown paths load index.html so the router handles them.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Always check for a new app version (the service worker and its entry points).
  location ~ ^/(index\.html|sw\.js|registerSW\.js|manifest\.webmanifest)$ {
    add_header Cache-Control "no-cache";
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
