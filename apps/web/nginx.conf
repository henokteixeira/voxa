# Upgrade the connection only for WebSocket requests.
map $http_upgrade $connection_upgrade {
  default upgrade;
  "" close;
}

server {
  listen 80;
  root /usr/share/nginx/html;

  # Single-page app: unknown paths load index.html so the router handles them.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Always check for a new app version (the service worker and its entry points).
  location ~ ^/(index\.html|sw\.js|registerSW\.js|manifest\.webmanifest)$ {
    add_header Cache-Control "no-cache";
  }

  # The API, on the app's own address (see src/lib/api.ts), with the voice WebSocket.
  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 1h;
    # Recordings (check-ins) are sent whole; the API caps them at 6 MB.
    client_max_body_size 8m;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
