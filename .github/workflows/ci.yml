name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  voice:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/voice
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Only the web layer is installed here; the speech models are too heavy for CI.
      - run: pip install fastapi python-multipart httpx pytest numpy soundfile
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Builds every image `docker compose up` needs (the voice image is too heavy to build anywhere else in CI).
      # Dev mode (docker-compose.override.yml is loaded by default): dev targets for api and web.
      - run: docker compose build
      # Production images too.
      - run: docker compose -f docker-compose.yml build api web
      # The dev web server starts with the source mounted and answers (dev images have their own names).
      - run: docker compose up -d --no-deps web
      - run: |
          for i in $(seq 1 30); do curl -fsS http://localhost:5173/ | grep -q '<div id="root">' && exit 0; sleep 2; done
          docker compose logs web; exit 1
